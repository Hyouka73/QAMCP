_version: "1"
module: "checkout"
description: "Formalización, firma electrónica y confirmación"
base_route: "/checkout"
views:
  - id: "summary-view"
    name: "Resumen de Contratación"
    path: "/checkout/review"
  - id: "signature-view"
    name: "Firma Digital"
    path: "/checkout/sign"
    surfaces:
      - id: "panel-signature"
        name: "Lienzo de Firma Biométrica"
        type: "section"
      - id: "modal-terms"
        name: "Términos y Condiciones"
        type: "modal"
sensitive_selectors:
  - "#bank-account-clabe"
