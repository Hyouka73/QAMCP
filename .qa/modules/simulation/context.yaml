_version: "1"
module: "simulation"
description: "Motor interactivo de cotización y escenarios"
base_route: "/simulation"
views:
  - id: "calculator-view"
    name: "Calculadora de Escenarios"
    path: "/simulation/calculator"
    surfaces:
      - id: "tab-parameters"
        name: "Parámetros Generales"
        type: "tab"
      - id: "tab-schedule"
        name: "Tabla de Amortización"
        type: "tab"
      - id: "tab-fees"
        name: "Comisiones y Gastos"
        type: "tab"
sensitive_selectors:
  - "#client-income"
  - "#rfc-tax-id"
